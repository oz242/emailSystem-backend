services:
  frontend:
    image: ghcr.io/oz242/emailsystem-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    networks:
      - emailsystem

  backend:
    image: ghcr.io/oz242/emailsystem-backend:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: "5000"
      FRONTEND_URL: http://localhost
      MONGODB_URI: mongodb://mongo:27017/emailSystem
      MONGODB_DB_NAME: emailSystem
      JWT_SECRET: change-this-to-a-long-random-secret-before-production
      JWT_EXPIRES_IN: 8h
      BCRYPT_ROUNDS: "12"
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    networks:
      - emailsystem

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - emailsystem

networks:
  emailsystem:
    driver: bridge

volumes:
  backend-data:
  backend-uploads:
  mongo-data:
